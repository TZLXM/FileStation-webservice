name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release gate tests
        run: node --test scripts/ci/verify-release-gate.test.mjs

      - name: Release tool tests
        run: node --test scripts/release/release-tools.test.mjs

      - name: Build shared workspace
        run: npm run build:shared

      - name: Server unit tests
        run: npm test --workspace=@filestation/server -- --runInBand

      - name: Server E2E tests
        run: npm run test:e2e --workspace=@filestation/server

      - name: Web unit tests
        working-directory: apps/web
        run: npx --no-install vitest run --no-cache

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check diff whitespace
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA}" ]]; then
            merge_base="$(git merge-base "${PR_BASE_SHA}" HEAD)"
            git diff --check "${merge_base}...HEAD"
          else
            git diff --check
          fi
