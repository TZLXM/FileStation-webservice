name: Feature Request
description: 提出新功能建议
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！请详细描述你的需求。

  - type: textarea
    id: problem
    attributes:
      label: 问题/需求
      description: 这个功能要解决什么问题？为什么需要它？
      placeholder: 当前当我想要 X 时，必须 Y，这很不方便因为 Z
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你期望如何实现这个功能
      placeholder: 我希望系统能够...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他解决方案

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 高 - 阻塞当前工作
        - 中 - 重要但不紧急
        - 低 - 有了更好
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索现有 issues，没有重复
          required: true
        - label: 我已阅读设计文档和路线图
          required: true
