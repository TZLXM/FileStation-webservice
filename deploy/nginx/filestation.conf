# FileStation Phase 1 反向代理
# 后端绑定 127.0.0.1:8080（Node listen 仅本机），Nginx 对外终结

# TLS 占位（生产启用时取消注释并指向证书；同时把下方 server 改为 listen 443 ssl）
# ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
# ssl_protocols       TLSv1.2 TLSv1.3;

upstream filestation {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    # 生产建议：仅允许 HTTPS，80 端口跳转
    # return 301 https://$host$request_uri;

    client_max_body_size 70m;          # 略大于最大分块 64MB
    proxy_request_buffering off;       # 分块上传流式转发（设计文档 §3.2 要求）
    proxy_buffering off;               # 下载流式转发（设计文档 §3.2 要求，v1.7 补全）
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ============ 初始化端点：仅本机（关键安全约束） ============
    location = /api/v1/auth/init {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://filestation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Entry-Id "entry_1";   # Nginx 覆盖，防客户端伪造
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Express 默认忽略整条路由大小写并接受一个尾随斜杠。
    # 精确 canonical init 在上方保留 allow/deny；其余等价变体统一拒绝。
    # Nginx location 匹配解码、合并斜杠和处理 . / .. 后的 URI。
    # 不得把 API prefix 改为 ^~，否则会跳过此安全 regex。
    location ~* ^/api/v1/auth/init/?$ {
        return 403;
    }

    # ============ 其余 API ============
    location /api/ {
        proxy_pass http://filestation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Entry-Id "entry_1";   # 统一覆盖
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ 前端静态资源 ============
    root /opt/filestation/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA 路由回退
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ============ 子路径部署 /fs/ ============
    # 使用 FILESTATION_BASE=/fs/ 构建 Web 后启用本段。
    # 根路径与子路径使用不同的构建产物，不能共用同一个 dist。
    # location = /fs {
    #     return 301 /fs/;
    # }
    #
    # location = /fs/api/v1/auth/init {
    #     allow 127.0.0.1;
    #     allow ::1;
    #     deny all;
    #
    #     proxy_pass http://filestation/api/v1/auth/init;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Entry-Id "entry_1";
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    #
    # # 同根路径：精确 canonical init 保留 allow/deny，大小写/尾斜杠变体拒绝。
    # # 包含 /fs 与整个 API 路径的大小写变化；不得给 API prefix 添加 ^~。
    # location ~* ^/fs/api/v1/auth/init/?$ {
    #     return 403;
    # }
    #
    # # /fs/api/v1/... -> /api/v1/... before proxying
    # location /fs/api/ {
    #     proxy_pass http://filestation/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Entry-Id "entry_1";
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    #
    # location /fs/assets/ {
    #     alias /opt/filestation/apps/web/dist/assets/;
    #     expires 7d;
    #     add_header Cache-Control "public, immutable";
    # }
    #
    # location /fs/ {
    #     rewrite ^/fs/(.*)$ /$1 break;
    #     try_files $uri /index.html;
    # }
}
